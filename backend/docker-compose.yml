version: '3.8'

services:
  # Backend FastAPI Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-youtuber-backend:latest
    container_name: ai-youtuber-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Override with EC2 host values if needed
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CHROMA_HOST=${CHROMA_HOST:-host.docker.internal}
      - CHROMA_PORT=${CHROMA_PORT:-8001}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app  # For development hot-reload (remove in production)
    depends_on:
      - redis
    networks:
      - ai-youtuber-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access host services
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  # Celery Worker for Video Processing
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-youtuber-backend:latest
    container_name: ai-youtuber-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CHROMA_HOST=${CHROMA_HOST:-host.docker.internal}
      - CHROMA_PORT=${CHROMA_PORT:-8001}
      - DATABASE_URL=${DATABASE_URL}
      - C_FORCE_ROOT=true  # Allow Celery to run as root (Docker only)
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app  # For development hot-reload (remove in production)
    depends_on:
      - redis
      - backend
    networks:
      - ai-youtuber-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker inspect ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: celery -A celery_worker worker --loglevel=info --concurrency=2 --max-tasks-per-child=50

  # Redis (Message Broker & Result Backend)
  # Comment this out if using existing Redis on EC2
  redis:
    image: redis:7-alpine
    container_name: ai-youtuber-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-youtuber-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

networks:
  ai-youtuber-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
