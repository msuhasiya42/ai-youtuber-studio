version: '3.8'

services:
  # Backend FastAPI Application - Production
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-youtuber-backend:latest
    container_name: ai-youtuber-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # Only expose to localhost, nginx will proxy
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - CHROMA_HOST=${CHROMA_HOST:-host.docker.internal}
      - CHROMA_PORT=${CHROMA_PORT:-8001}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./logs:/app/logs
    networks:
      - ai-youtuber-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  # Celery Worker - Production (handles all queues)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-youtuber-backend:latest
    container_name: ai-youtuber-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - CHROMA_HOST=${CHROMA_HOST:-host.docker.internal}
      - CHROMA_PORT=${CHROMA_PORT:-8001}
      - DATABASE_URL=${DATABASE_URL}
      - C_FORCE_ROOT=true
    volumes:
      - ./logs:/app/logs
    depends_on:
      - backend
    networks:
      - ai-youtuber-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker inspect ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      celery -A celery_worker worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=100
      --queues=ingest,transcribe,embedding,generation,insights

networks:
  ai-youtuber-network:
    driver: bridge
