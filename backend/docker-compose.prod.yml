version: '3.8'

services:
  # Redis (Message Broker & Cache)
  redis:
    image: redis:7
    container_name: ai-youtuber-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-youtuber-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # ChromaDB (Vector Database)
  chroma:
    image: chromadb/chroma:0.6.3
    container_name: ai-youtuber-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - ai-youtuber-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v2/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend FastAPI Application - Production
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-youtuber-backend:latest
    container_name: ai-youtuber-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # Only expose to localhost, nginx will proxy
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - chroma
    networks:
      - ai-youtuber-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import http.client,sys; conn=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); conn.request('GET','/api/health'); r=conn.getresponse(); body=r.read().decode(); sys.exit(0) if r.status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  # Celery Worker - Production (handles all queues)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-youtuber-backend:latest
    container_name: ai-youtuber-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - C_FORCE_ROOT=true
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - chroma
      - backend
    networks:
      - ai-youtuber-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker inspect ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      celery -A celery_worker worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=100
      --queues=ingest,transcribe,embedding,generation,insights

networks:
  ai-youtuber-network:
    driver: bridge

volumes:
  redis_data:
  chroma_data:
